# =============================================================================
# 鑑定スキル表・判定の要点の「解釈ルール」設定ファイル
#
# このファイルを書き換えると、次の2つに反映されます（サーバーの再起動は不要）。
#   1. 鑑定スキル表の点数（[[rules]] の adjust による補正）
#   2. 判定の要点（AI解説）に渡す解釈（principles・day_stems・[[rules]] の interpretation）
#
# 書き方の詳細: doc/解釈ルール設定.md
# 書き換えたら version の日付を更新してください（AI解説のキャッシュは内容が変われば自動で別扱いになります）。
#
# ※ 初期の内容は、四柱推命の一般的な考え方で作った「叩き台」です。
#    陽てん塾の流儀に合わせて自由に書き換えてください。
# =============================================================================

version = "2026-11-06"

# -----------------------------------------------------------------------------
# AI解説の読み方の原則（上から順に重要。AIへの指示にそのまま入ります）
# -----------------------------------------------------------------------------
principles = [
  "日干を最重要の起点にする。まず day_stem（日干の五行・陰陽・性質）を確認し、すべての解説を「この日干の人にとって」という視点で組み立てる。",
  "五行の点数は量だけでなく、日干から見た関係も読む。element_relations の relation（日干を生じる／日干を剋す など）と role（喜＝日干の助けになる、忌＝負担・過剰になりやすい、中＝どちらにも働く）を必ず踏まえる。",
  "同じ五行が多くても、日干にとって忌であれば「強み」ではなく「重さ・プレッシャー・偏り」として出ることがある。身旺・身弱（strength）による効き方の違いを明確に書く。",
  "applied_rules は判定ルールで確定した解釈であり、点数の補正もこのルールによる。該当する能力・職種の説明では、必ずこの解釈を根拠に使う。",
  "「○○の五行が多いから○○が高い」と点数を言い換えるだけで終わらせない。他の五行との総合的なバランスを考えた解釈をすること。",
]

# -----------------------------------------------------------------------------
# 身旺・身弱ごとの、日干から見た各五行グループの役割
#   喜 = 日干の助けになる（強めたい）／ 忌 = 過剰・負担になりやすい ／ 中 = どちらにも働く
#   アプリの命式画面の説明（身旺は食傷・財を強める、身弱は比劫・印を強める、官は中立）に合わせている
# -----------------------------------------------------------------------------
[strength_roles."身旺"]
"比劫" = "忌"
"印" = "忌"
"食傷" = "喜"
"財" = "喜"
"官" = "中"

[strength_roles."身弱"]
"比劫" = "喜"
"印" = "喜"
"食傷" = "忌"
"財" = "忌"
"官" = "中"

[strength_roles."中和"]
"比劫" = "中"
"印" = "中"
"食傷" = "中"
"財" = "中"
"官" = "中"

# -----------------------------------------------------------------------------
# 日干ごとの性質（AI解説の起点。nature=本質、strengths=出やすい強み、cautions=注意点）
# adjust を書くと、その日干の人の点数にも補正をかけられる（書き方は [[rules]] と同じ）
# -----------------------------------------------------------------------------
[day_stems."甲"]
nature = "大樹。まっすぐ上に伸びようとする向上心と、筋を通す芯の強さを持つ。"
strengths = "目標に向かって伸び続ける力、頼られる親分肌、物事を始める力"
cautions = "曲がることが苦手で、方針転換や妥協に時間がかかりやすい"

[day_stems."乙"]
nature = "草花・つる草。しなやかに環境へ合わせ、人とのつながりを伝って広がる。"
strengths = "柔軟性、協調性、踏まれても立ち直る粘り強さ、縁を活かす力"
cautions = "周囲に合わせすぎて、自分で決めることを後回しにしやすい"

[day_stems."丙"]
nature = "太陽。明るく開放的で、周囲を照らし人を集める。"
strengths = "発信力、明るさ、場を盛り上げる力、裏表のなさ"
cautions = "勢いで進めて細部や継続が粗くなりやすい"

[day_stems."丁"]
nature = "灯火。内に熱を秘め、身近な人や一点を照らし続ける。"
strengths = "洞察力、集中力、一人ひとりへの細やかな配慮、技を磨く力"
cautions = "感情の波が出やすく、気にしすぎて消耗しやすい"

[day_stems."戊"]
nature = "山。どっしりと動かず、人や物を受け止める包容力を持つ。"
strengths = "安定感、信頼感、受け止める力、物事を長く維持する力"
cautions = "腰が重く、変化への対応や決断が遅れやすい"

[day_stems."己"]
nature = "田畑。種を受け止めて育て、実りに変える。"
strengths = "人や物事を育てる力、面倒見、実務の多才さ、吸収力"
cautions = "何でも受け止めて抱え込み、迷いやすい"

[day_stems."庚"]
nature = "鉄・鉱石。硬く強い素材で、火（官）に鍛えられて道具や刀になる。"
strengths = "決断力、行動力、正義感、鍛えられて伸びる力、技術の習得"
cautions = "不器用で融通が利きにくく、鍛える場（規律・目標）がないと力を持て余す"

[day_stems."辛"]
nature = "宝石・貴金属。磨かれて輝き、美しさや品質にこだわる。"
strengths = "美意識、品質へのこだわり、繊細な感性、プライドを力に変える"
cautions = "傷つきやすく、完璧を求めて動けなくなりやすい"

[day_stems."壬"]
nature = "大河・海。スケールが大きく、止まらず流れ続ける。"
strengths = "発想の大きさ、自由さ、知恵、状況に合わせて形を変える力"
cautions = "流されやすく、締まりや継続に欠けやすい"

[day_stems."癸"]
nature = "雨・露。静かに染み込み、周囲を潤す。"
strengths = "静かな知性、浸透力、裏方で支える力、忍耐"
cautions = "自己主張が控えめで、押しの強さや持久力は出にくい"

# =============================================================================
# 判定ルール
#
# when（条件）をすべて満たすと、そのルールが適用されます。
#   ※ TOML では日本語の項目名を "財" のように引用符で囲みます。
#   strength          = ["身弱"]              身旺・身弱・中和のいずれか
#   day_stem          = ["庚", "辛"]          日干
#   day_element       = ["金"]                日干の五行（木・火・土・金・水）
#   top_group         = "官"                  そのグループが5つの中で最大（同点も含む）
#   group_at_least    = { "財" = 30 }           グループの点数がその値以上
#   group_below       = { "官" = 10 }           グループの点数がその値未満
#   group_rank_within = { "食傷" = 2 }          グループの順位がその値以内
#   strength_diff_at_least / strength_diff_below = 数値   身旺度（比劫＋印 −（食傷＋財＋官））
#   kakukyoku_any     = ["偏官格"]            格局にいずれかの格名を含む
#   stem_stars        = [["傷官"], ["正官", "偏官"]]
#                       天干（日干を除く）に、各リストの星が1つ以上ずつある
#
# interpretation（解釈）: AI解説に渡す文。{財} {官} {身旺度} などで点数を差し込める。
#
# adjust（点数補正）: 能力の点数に足し引きする。表の「内訳」にはルールの title で記録される。
#   ability = 能力（kikaku 企画 / chiryaku 知略 / jikkou 実行 / tairyoku 体力 / jinbou 人望 /
#             touritsu 統率 / kaitaku 開拓 / shousai 商才 / kanri 管理）
#   value   = 足す点数（マイナスで減点）
#   per     = 掛ける元の値（省略時は value をそのまま足す）。五行グループ名（比劫・印・食傷・財・官）、
#             通変星名（比肩〜印綬）、"身旺度"、またはそれらのリスト（合計に掛ける）
#   min / max = 補正量の下限・上限
# =============================================================================

# --- 日干と五行の関係による解釈（点数補正あり） --------------------------------

[[rules]]
id = "mijaku_kan_heavy"
title = "身弱で官が重い（身弱殺重）"
when = { strength = ["身弱"], top_group = "官" }
interpretation = "官（日干を剋す、規律・組織の力）が {官} と最も強いが、日干は身弱で受け止める力が足りない。官は人を率いる力ではなく、外から課される規律やプレッシャーとして働きやすい。自ら先頭に立つより、ルールや段取りを守り整える側で力が出やすい。"
adjust = [
  { ability = "touritsu", per = "官", value = -1.0 },
  { ability = "touritsu", per = ["正官", "偏官"], value = -0.3 },
  { ability = "kaitaku", per = "偏官", value = -0.5 },
  { ability = "kanri", per = "官", value = 0.3, max = 25 },
]

[[rules]]
id = "mijaku_stamina"
title = "身弱による体力・持続力の補正"
when = { strength = ["身弱"] }
interpretation = "日干を支える比劫・印に対して、日干の力を使う食傷・財・官が多い（身旺度 {身旺度}）。長時間動き続ける体力や持続力は出にくく、休息や役割分担を前提にすると力を保ちやすい。"
adjust = [
  { ability = "tairyoku", per = "身旺度", value = 0.3, min = -30 },
  { ability = "jikkou", per = "身旺度", value = 0.1, min = -10 },
]

[[rules]]
id = "mijaku_zai_heavy"
title = "身弱で財が重い（財多身弱）"
when = { strength = ["身弱"], top_group = "財" }
interpretation = "財（日干が剋す、お金・成果を扱う力）が {財} と最も強いが、日干は身弱で持ちきれない。お金や案件は回ってくるが、抱えきれずに手放しやすい。"
adjust = [
  { ability = "shousai", per = "財", value = -0.5 },
]

[[rules]]
id = "mijaku_shokushou_heavy"
title = "身弱で食傷が重い（洩身太過）"
when = { strength = ["身弱"], top_group = "食傷" }
interpretation = "食傷（日干が生じる、表現・出力の力）が {食傷} と最も強く、身弱の日干から力が流れ出やすい。アイデアや発信は豊富だが、出し続けると消耗しやすい。"
adjust = [
  { ability = "tairyoku", per = "食傷", value = -0.2, min = -15 },
]

[[rules]]
id = "zai_in_conflict"
title = "財と印がともに強い（財印相剋）"
when = { group_at_least = { "財" = 30, "印" = 30 } }
interpretation = "財（お金・成果を扱う力）{財} と印（学び・信用の力）{印} がともに強く、財は印を剋すためぶつかり合う配置。お金の扱いに迷いや揺れが出やすく、学びや技術を稼ぎに素直につなげにくい。"
adjust = [
  { ability = "shousai", per = "財", value = -0.6 },
  { ability = "kanri", value = -10 },
]

[[rules]]
id = "kan_weak"
title = "官が弱い"
when = { group_below = { "官" = 10 } }
interpretation = "官（規律・組織の力）が {官} と弱い。期限・規程・組織運営などの「枠」を自分で保つのは得意ではなく、仕組みや人に任せると安定する。"
adjust = [
  { ability = "kanri", value = -10 },
  { ability = "touritsu", value = -5 },
]

# --- 注記（点数補正なし。AI解説の根拠として渡す） --------------------------------

[[rules]]
id = "shokan_kenkan"
title = "傷官見官"
when = { stem_stars = [["傷官"], ["正官", "偏官"]] }
interpretation = "天干に傷官と官星が並ぶ（傷官見官）。既存のルールや上下関係に反発しやすく、自分自身の管理や客観視が弱まりやすい。"

[[rules]]
id = "in_dominant"
title = "印が最も強い身旺"
when = { strength = ["身旺"], top_group = "印" }
interpretation = "印が最も強い身旺（印 {印}）：学びが厚い一方、考えすぎて出力が遅れやすい。"

[[rules]]
id = "zai_scarce"
title = "財星がほぼない"
when = { group_below = { "財" = 5 } }
interpretation = "財星がほぼない（財 {財}）。お金や数字を扱う仕組みは意識して補う必要がある。"

[[rules]]
id = "kan_scarce"
title = "官星がほぼない"
when = { group_below = { "官" = 5 } }
interpretation = "官星がほぼない（官 {官}）。"

[[rules]]
id = "shokushou_strong"
title = "食傷が強い"
when = { group_at_least = { "食傷" = 20 }, group_rank_within = { "食傷" = 2 } }
interpretation = "食傷が強い（食傷 {食傷}）：表現・制作の出口が太い。"
