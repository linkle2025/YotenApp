# Nginxリバースプロキシ設定
# このファイルを /etc/nginx/sites-available/yotenapp にコピーし、
# /etc/nginx/sites-enabled/yotenapp にシンボリックリンクを作成してください
#
# 設定後、以下を実行:
# sudo ln -s /etc/nginx/sites-available/yotenapp /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx

# 既存のSSL証明書のパスを確認して、以下を適切に設定してください
# SSL証明書のパスは通常以下のいずれかです:
# - /etc/letsencrypt/live/app.yoten.org/fullchain.pem
# - /etc/ssl/certs/app.yoten.org.crt
# - その他の証明書パス

# HTTPからHTTPSへのリダイレクト
server {
    listen 80;
    server_name app.yoten.org;
    
    # Let's Encryptの認証用（既に証明書がある場合は不要）
    # location /.well-known/acme-challenge/ {
    #     root /var/www/html;
    # }
    
    # HTTPSにリダイレクト
    return 301 https://$server_name$request_uri;
}

# HTTPS設定
server {
    listen 443 ssl http2;
    server_name app.yoten.org;

    # SSL証明書の設定（既存の証明書パスに置き換えてください）
    # Let's Encryptの場合:
    # ssl_certificate /etc/letsencrypt/live/app.yoten.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.yoten.org/privkey.pem;
    
    # その他の証明書の場合、適切なパスに変更してください
    # ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;

    # SSL設定（推奨設定）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # セキュリティヘッダー
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ログ設定
    access_log /var/log/nginx/yotenapp_access.log;
    error_log /var/log/nginx/yotenapp_error.log;

    # クライアントの最大ボディサイズ
    client_max_body_size 10M;

    # Django 管理画面（/api ではなくルート直下のため別 location が必要）
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Django 管理画面の静的ファイル（collectstatic / WhiteNoise）
    location ^~ /static {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # バックエンドAPIへのプロキシ設定
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocketサポート（必要に応じて）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # フロントエンドへのプロキシ設定
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静的ファイルの直接配信（オプション）
    # location /static/ {
    #     alias /path/to/staticfiles/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
    
    # location /media/ {
    #     alias /path/to/media/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}
