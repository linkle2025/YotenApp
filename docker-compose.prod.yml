services:
  db:
    image: postgres:15
    container_name: yotenapp_postgres_prod
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-yotenapp}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-yotenapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yotenapp-network-prod
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: yotenapp_backend_prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_NAME=${DATABASE_NAME:-yotenapp}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-app.yoten.org}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://app.yoten.org}
      # 判定の要点（Gemini API）。詳細: doc/判定の要点生成.md
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_PAID_TIER_CONFIRMED=${GEMINI_PAID_TIER_CONFIRMED:-False}
      - SKILL_INSIGHT_ENABLED=${SKILL_INSIGHT_ENABLED:-True}
      - SKILL_INSIGHT_DAILY_LIMIT=${SKILL_INSIGHT_DAILY_LIMIT:-20}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-40}
      # メール送信（パスワードリセット）。詳細: doc/パスワードリセット.md
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - EMAIL_TIMEOUT=${EMAIL_TIMEOUT:-20}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@yoten.app}
      - FRONTEND_URL=${FRONTEND_URL:-https://app.yoten.org}
      - PASSWORD_RESET_TIMEOUT=${PASSWORD_RESET_TIMEOUT:-3600}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yotenapp-network-prod
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-https://app.yoten.org/api}
    container_name: yotenapp_frontend_prod
    # イメージ内のビルド済みファイルを使用（ホストの frontend/build がないと空になるためマウントを削除）
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
    networks:
      - yotenapp-network-prod
    restart: unless-stopped

networks:
  yotenapp-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
  static_volume:
  media_volume:
