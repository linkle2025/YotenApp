version: '3.8'

services:
  db:
    image: postgres:15
    container_name: yotenapp_postgres_prod
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-yotenapp}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-yotenapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yotenapp-network-prod
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: yotenapp_backend_prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_NAME=${DATABASE_NAME:-yotenapp}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-app.yoten.org}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://app.yoten.org}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yotenapp-network-prod
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-https://app.yoten.org/api}
    container_name: yotenapp_frontend_prod
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - yotenapp-network-prod
    restart: unless-stopped

networks:
  yotenapp-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
  static_volume:
  media_volume:
